name: GitHub to Gitee backup

on:
  push:
    paths:
      - '.github/workflows/github-to-gitee.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-public-repositories:
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      OWNER: ckstock
    steps:
      - name: Check Gitee token is configured
        run: test -n "$GITEE_TOKEN"

      - name: Mirror every public repository
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl -fsSL "https://api.github.com/users/${OWNER}/repos?type=owner&per_page=100" \
            | jq -r '.[] | select(.private == false) | .name' \
            | grep -vx 'github-gitee-mirror' \
            | while IFS= read -r repo; do
                echo "Mirroring ${repo}"
                gitee_status="$(curl -sS -o /dev/null -w '%{http_code}' \
                  --get --data-urlencode "access_token=${GITEE_TOKEN}" \
                  "https://gitee.com/api/v5/repos/${OWNER}/${repo}")"
                if [ "$gitee_status" = '404' ]; then
                  curl -fsS -X POST 'https://gitee.com/api/v5/user/repos' \
                    --data-urlencode "access_token=${GITEE_TOKEN}" \
                    --data-urlencode "name=${repo}" \
                    --data-urlencode 'private=false' >/dev/null
                elif [ "$gitee_status" != '200' ]; then
                  echo "Gitee lookup for ${repo} returned HTTP ${gitee_status}" >&2
                  exit 1
                fi

                repo_dir="${workdir}/${repo}"
                git clone --origin origin "https://github.com/${OWNER}/${repo}.git" "$repo_dir"
                git -C "$repo_dir" remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${OWNER}/${repo}.git"
                git -C "$repo_dir" fetch origin

                git -C "$repo_dir" for-each-ref --format='%(refname:short)' refs/remotes/origin \
                  | while IFS= read -r remote_branch; do
                      [ "$remote_branch" = 'origin' ] && continue
                      [ "$remote_branch" = 'origin/HEAD' ] && continue
                      branch="${remote_branch#origin/}"
                      git -C "$repo_dir" push gitee "refs/remotes/${remote_branch}:refs/heads/${branch}"
                    done
                git -C "$repo_dir" push gitee --tags
              done

  mirror-private-repositories:
    runs-on: ubuntu-latest
    env:
      OWNER: ckstock
      GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Validate tokens for private repositories
        shell: bash
        run: |
          if [[ -z "$GH_MIRROR_TOKEN" ]]; then
            echo "::error::Missing GH_MIRROR_TOKEN secret. Add a GitHub fine-grained token with read access to all source repositories."
            exit 1
          fi
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo "::error::Missing GITEE_TOKEN secret."
            exit 1
          fi

      - name: Back up private GitHub repositories to private Gitee repositories
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          repo_list="$workdir/private-repos.txt"
          : > "$repo_list"

          page=1
          while :; do
            response="$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_MIRROR_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/repos?affiliation=owner&visibility=private&per_page=100&page=$page")"
            jq -e 'type == "array"' <<< "$response" >/dev/null
            count="$(jq 'length' <<< "$response")"
            jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner and .private == true) | .name' <<< "$response" >> "$repo_list"
            if (( count < 100 )); then
              break
            fi
            page=$((page + 1))
          done

          if [[ ! -s "$repo_list" ]]; then
            echo "::error::No private repositories available to GH_MIRROR_TOKEN. Check token repository access."
            exit 1
          fi
          echo "Private repositories found: $(wc -l < "$repo_list")"

          while IFS= read -r repo; do
            # The Actions repository is public: redact private repository names from logs.
            echo "::add-mask::$repo"
            echo "Processing private repository"

            gitee_status="$(curl -sS -o "$workdir/gitee.json" -w '%{http_code}' \
              --get --data-urlencode "access_token=$GITEE_TOKEN" \
              "https://gitee.com/api/v5/repos/$OWNER/$repo")"

            target_repo="$repo"
            if [[ "$gitee_status" == "404" ]]; then
              target_repo="${repo,,}"
              echo "::add-mask::$target_repo"
              gitee_status="$(curl -sS -o "$workdir/gitee.json" -w '%{http_code}' --get --data-urlencode "access_token=$GITEE_TOKEN" "https://gitee.com/api/v5/repos/$OWNER/$target_repo")"
            fi
            if [[ "$gitee_status" == "404" ]]; then
              matched=""
              target_page=1
              while :; do
                targets="$(curl -fsSL --get --data-urlencode "access_token=$GITEE_TOKEN" --data-urlencode 'type=owner' --data-urlencode 'per_page=100' --data-urlencode "page=$target_page" "https://gitee.com/api/v5/user/repos")"
                matched="$(jq -r --arg name "$repo" '.[] | select((.name|ascii_downcase)==($name|ascii_downcase)) | .path' <<< "$targets" | head -n1)"
                [[ -n "$matched" ]] && break
                [[ "$(jq length <<< "$targets")" -lt 100 ]] && break
                target_page=$((target_page+1))
              done
              if [[ -n "$matched" ]]; then
                target_repo="$matched"
                echo "::add-mask::$target_repo"
                curl -fsSL --get --data-urlencode "access_token=$GITEE_TOKEN" "https://gitee.com/api/v5/repos/$OWNER/$target_repo" > "$workdir/gitee.json"
              else
              target_repo="$repo"
              curl --fail-with-body -sSL --retry 3 -X POST "https://gitee.com/api/v5/user/repos" \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "name=$repo" \
                --data-urlencode "private=true" > "$workdir/gitee.json" || { jq -c 'del(.access_token,.token,.password,.secret)' "$workdir/gitee.json"; exit 1; }
              fi
            elif [[ "$gitee_status" != "200" ]]; then
              echo "::error::Gitee repository lookup failed with HTTP $gitee_status"
              exit 1
            fi

            # Never write private GitHub code into a public Gitee repository.
            if ! jq -e '.private == true' "$workdir/gitee.json" >/dev/null; then
              echo "::error::Target Gitee repository is not private. No code was pushed."
              exit 1
            fi

            repo_dir="$workdir/$repo"
            basic_auth="$(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: Basic $basic_auth" \
              clone --quiet --origin origin "https://github.com/$OWNER/$repo.git" "$repo_dir"
            unset basic_auth
            git -C "$repo_dir" remote add gitee "https://oauth2:$GITEE_TOKEN@gitee.com/$OWNER/$target_repo.git"

            git -C "$repo_dir" for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | while IFS= read -r remote_branch; do
                  [[ "$remote_branch" == "origin" ]] && continue
                  [[ "$remote_branch" == "origin/HEAD" ]] && continue
                  branch="${remote_branch#origin/}"
                  git -C "$repo_dir" push --quiet gitee "refs/remotes/$remote_branch:refs/heads/$branch"
                done
            git -C "$repo_dir" push --quiet gitee --tags
            echo "Private repository branches and tags processed"
          done < "$repo_list"

  audit-gitee-repositories:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      OWNER: ckstock
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Read-only Gitee backup audit
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GITEE_TOKEN" ]]; then
            echo "::error::GITEE_TOKEN is not set."
            exit 1
          fi

          # Check the explicitly requested repository without logging any credentials.
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          status="$(curl -sS -o "$result_file" -w '%{http_code}' --get \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "https://gitee.com/api/v5/repos/$OWNER/EAAPI")"
          echo "EAAPI lookup HTTP status: $status"
          if [[ "$status" == "200" ]]; then
            jq -r '"EAAPI is_private: \(.private); default_branch: \(.default_branch // "unknown")"' "$result_file"
          else
            echo "EAAPI cannot be confirmed with this token (404 can mean absent or unauthorized)."
          fi

          page=1
          total=0
          total_private=0
          total_public=0
          while :; do
            status="$(curl -sS -o "$result_file" -w '%{http_code}' --get \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "type=owner" --data-urlencode "per_page=100" \
              --data-urlencode "page=$page" \
              "https://gitee.com/api/v5/user/repos")"
            if [[ "$status" != "200" ]]; then
              echo "::error::Cannot list Gitee repositories, HTTP $status."
              exit 1
            fi
            jq -e 'type == "array"' "$result_file" >/dev/null
            n="$(jq 'length' "$result_file")"
            total=$((total + n))
            private="$(jq '[.[] | select(.private == true)] | length' "$result_file")"
            public="$(jq '[.[] | select(.private == false)] | length' "$result_file")"
            total_private=$((total_private + private))
            total_public=$((total_public + public))
            if (( n < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          echo "Gitee owned repository counts (visible to token): total=$total private=$total_private public=$total_public"
